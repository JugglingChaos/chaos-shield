name: Release

# Run it from the Actions tab (Release > Run workflow) to release the version in
# chaos-shield.php, or push a tag such as v1.13.0. The checks run first; the zip is
# attached to a GitHub release, which sites running Chaos Shield pick up as an update.
# The WordPress.org copy (no GitHub updater) is attached next to it, ready to submit.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    name: Build and publish
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the version matches everywhere
        run: |
          CODE=$(sed -n "s/^define( 'CSHIELD_VERSION', '\([^']*\)' );/\1/p" chaos-shield.php)
          HEADER=$(sed -n 's/^ \* Version: *//p' chaos-shield.php)
          STABLE=$(sed -n 's/^Stable tag: *//p' readme.txt)
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION=${GITHUB_REF_NAME#v}; else VERSION=$CODE; fi
          for v in "$CODE" "$HEADER" "$STABLE"; do
            if [ "$v" != "$VERSION" ]; then
              echo "::error::Version mismatch: release $VERSION, CSHIELD_VERSION $CODE, header $HEADER, readme stable tag $STABLE"
              exit 1
            fi
          done
          grep -q "^= $VERSION =" readme.txt || { echo "::error::readme.txt has no changelog entry for $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build the zips
        run: |
          sh bin/build-zip.sh dist
          sh bin/build-zip.sh --wporg dist
      - name: Release notes from the readme changelog
        run: awk -v head="= $VERSION =" '$0 == head { on = 1; next } /^= / && on { exit } on' readme.txt > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "dist/chaos-shield-$VERSION.zip" "dist/wporg-chaos-shield-$VERSION.zip" --clobber
          else
            gh release create "v$VERSION" "dist/chaos-shield-$VERSION.zip" "dist/wporg-chaos-shield-$VERSION.zip" --target "$GITHUB_SHA" --title "Chaos Shield $VERSION" --notes-file notes.md
          fi
